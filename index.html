<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>領袖學院 · Phase 1 版型</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Barlow+Condensed:wght@600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--canvas:#f2f2f3;--card:#fff;--ink:#1d1f20;--line:rgba(29,31,32,.16);--accent:#5980a6;--accent-700:#416180;--n600:#7a7a7d;
    --zh:"Noto Sans TC",system-ui,sans-serif;--lat:"Barlow","Noto Sans TC",system-ui,sans-serif;--cond:"Barlow Condensed","Noto Sans TC",sans-serif;}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:clamp(20px,5vw,72px);
    background:var(--canvas);color:var(--ink);font-family:var(--lat);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
  .wrap{width:100%;max-width:760px}
  .brand b{font-family:var(--zh);font-weight:700;font-size:22px;letter-spacing:.1em;display:block}
  .brand small{font-family:var(--cond);font-weight:600;font-size:10px;letter-spacing:.36em;text-transform:uppercase;color:var(--accent-700);display:block;margin-top:6px}
  h1{font-family:var(--zh);font-weight:700;font-size:clamp(24px,3.4vw,34px);line-height:1.3;margin:28px 0 12px;letter-spacing:.02em}
  p.lede{font-family:var(--zh);color:rgba(29,31,32,.72);margin:0 0 32px;max-width:44em;line-height:1.9}
  .grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
  a.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px;text-decoration:none;color:inherit;transition:.15s}
  a.card:hover{border-color:var(--accent);box-shadow:0 3px 12px rgba(43,43,45,.12)}
  a.card b{font-family:var(--zh);font-weight:700;font-size:18px;display:block}
  a.card span{display:block;margin-top:6px;font-size:13px;color:var(--n600);font-family:var(--zh)}
  a.card em{display:block;margin-top:14px;font-family:var(--cond);font-weight:600;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-700);font-style:normal}
  .note{margin-top:32px;padding-top:20px;border-top:1px solid var(--line);font-family:var(--zh);font-size:12.5px;line-height:1.9;color:var(--n600)}
  .note b{color:var(--ink)}
  code{font-family:var(--cond);font-size:12.5px;background:rgba(29,31,32,.06);padding:1px 5px;border-radius:4px}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><b>領袖學院</b><small>Leadership Academy</small></div>
  <h1>Phase 1 版型（靜態匯出）</h1>
  <p class="lede">依《需求說明書 v1.3》與《開發規格書 v0.2》製作的可點擊版型。資料為假資料，沒有後端與資料庫，表單送出不會有實際行為。</p>
  <div class="grid">
    <a class="card" href="/web/">
      <b>前台</b>
      <span>會員端網站 — 需求書第 3 章</span>
      <em>198 pages</em>
    </a>
    <a class="card" href="/admin/">
      <b>後台</b>
      <span>管理後台 — 需求書第 4 章</span>
      <em>49 pages</em>
    </a>
  </div>
  <p class="note">
    <b>需要用 HTTP 伺服器開啟</b>，資源路徑為絕對路徑，直接雙擊 <code>file://</code> 開會空白。
    在 <code>static/</code> 的上一層執行 <code>npx serve static</code> 即可。
  </p>
</div>
</body>
</html>
